name: Control visual puntual del Volumen I
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vista-previa-volumen-i.yml'
permissions:
  contents: write
jobs:
  visualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar renderizador de páginas
        run: python -m pip install --disable-pip-version-check pypdfium2 pillow
      - name: Renderizar seis páginas para control visual
        run: |
          python - <<'PY'
          from pathlib import Path
          import pypdfium2 as pdfium
          root=Path('ediciones/volumen-I')
          doc=pdfium.PdfDocument(str(root/'corpus-hispanico-guerra-volumen-I.pdf'))
          assert len(doc)>=300
          pages=[('portada',0),('preliminares',1),('indice',6),('primeros-estudios',34),('interior',len(doc)//2),('bibliografia',len(doc)-8)]
          for name,n in pages:
              im=doc[n].render(scale=1.15).to_pil()
              im.save(root/f'vista-{name}.png',optimize=True)
              print(name,'página',n+1,im.size)
          PY
      - name: Guardar muestras del volumen
        uses: actions/upload-artifact@v4
        with:
          name: muestras-visuales-volumen-i
          path: ediciones/volumen-I/vista-*.png
      - name: Publicar muestras de las páginas del libro
        run: |
          git add ediciones/volumen-I/vista-*.png
          git config user.name corpus-edicion-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Documentar seis páginas de prueba visual del Volumen I"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
