name: Publicación editorial
on:
  # Publicación autorizada por el titular, cada quince minutos.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Publicación manual de una ficha aprobada
        type: choice
        options: ['15min', '21:17']
        default: '15min'
      dry_run:
        description: Simular sin publicar
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: publicacion-corpus
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas de seguridad editorial
        run: python -m unittest discover -s tests -v
      - name: Seleccionar ficha aprobada y programada
        env:
          SLOT: ${{ inputs.slot }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--interval-15)
          if [ "$SLOT" = "21:17" ]; then args=(--slot "21:17"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_next.py "${args[@]}"
      - name: Validar web antes de confirmar publicación
        run: python scripts/check.py
      - name: Guardar publicación e inventario
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain content editorial dist)" ]]; then
            git config user.name "corpus-editorial-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content editorial dist
            git commit -m "Publicar ficha aprobada en intervalo de quince minutos"
            git push
          fi
