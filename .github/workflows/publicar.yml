name: Publicación editorial
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: Europe/Madrid
    - cron: '17 15 * * *'
      timezone: Europe/Madrid
    - cron: '17 21 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      slot:
        description: Franja editorial
        type: choice
        options: ['09:17', '15:17', '21:17']
        default: '09:17'
      dry_run:
        description: Simular sin publicar
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: publicacion-corpus
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas de seguridad editorial
        run: python -m unittest discover -s tests -v
      - name: Seleccionar ficha
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$SLOT" ]; then args+=(--slot "$SLOT"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_next.py "${args[@]}"
      - name: Validar web antes de confirmar publicación
        run: python scripts/check.py
      - name: Guardar publicación e inventario
        run: |
          if [[ -n "$(git status --porcelain content editorial dist)" ]]; then
            git config user.name "corpus-editorial-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content editorial dist
            git commit -m "Publicación de ficha aprobada e inventario"
            git push
          fi
