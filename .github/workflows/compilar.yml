name: Compilar web estática
on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corpus-static-sync
  cancel-in-progress: false
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar reglas editoriales
        run: python -m unittest discover -s tests -v
      - name: Compilar y comprobar archivos del sitio
        run: python scripts/check.py
      - name: Sincronizar web para Cloudflare Workers
        shell: bash
        run: |
          git add -A dist
          if ! git diff --cached --quiet; then
            git config user.name "corpus-build-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar web estática validada"
            git push origin HEAD:main
          else
            echo "No hay cambios en la web estática."
          fi
